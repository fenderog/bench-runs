<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bench Runs</title>
<meta name="description" content="LLM benchmark runs: results, artifacts and provenance.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css?v=1hiryo6">
<script>
  // ── Site configuration ──────────────────────────────────────────────────────
  window.BENCH_CONFIG = {
    title: 'Bench Runs',
    subtitle: 'LLM evaluation runs — results, artifacts, provenance.',
    manifest: 'data/results.json',   // generated by scripts/build-manifest.mjs
    repoUrl: 'https://github.com/fenderog/bench-runs'
  };
  // Apply the saved theme before paint to avoid a flash.
  try {
    var saved = localStorage.getItem('bench.theme');
    document.documentElement.dataset.theme = saved ||
      (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  } catch (e) {}
</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to results</a>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/" id="brandLink">
      <span class="brand-title" id="siteTitle">Bench Runs</span>
    </a>
    <div class="topbar-actions">
      <a class="btn" id="repoBtn" target="_blank" rel="noopener noreferrer" hidden>GitHub</a>
      <button type="button" class="btn btn-icon" id="themeBtn" title="Toggle theme (T)" aria-label="Toggle colour theme">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M21 13.2A8.6 8.6 0 1 1 10.8 3a6.6 6.6 0 0 0 10.2 10.2Z"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="main">
  <!-- ── index ────────────────────────────────────────────────────────────── -->
  <div id="indexView">
    <p class="meta" id="meta">loading…</p>

    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input type="search" id="search" placeholder="Search runs" autocomplete="off" spellcheck="false" aria-label="Search runs">
        <button type="button" class="search-clear" id="searchClear" aria-label="Clear search" hidden>✕</button>
      </div>
      <label class="select">
        <span class="select-label">Sort</span>
        <select id="sort" aria-label="Sort runs">
          <option value="date-desc">Newest first</option>
          <option value="date-asc">Oldest first</option>
          <option value="title-asc">Title A–Z</option>
          <option value="model-asc">Model A–Z</option>
        </select>
      </label>
    </div>

    <div class="chips" id="filters"></div>

    <div class="notice" id="notice" hidden></div>

    <ul class="runs" id="runs" aria-label="Benchmark runs"></ul>

    <div class="empty" id="empty" hidden>
      <p id="emptyHint">No runs match the current search.</p>
    </div>
  </div>

  <!-- ── run detail ───────────────────────────────────────────────────────── -->
  <article class="run" id="runView" hidden></article>

  <footer class="footer">
    <span id="footerMeta"></span>
  </footer>
</main>

<div class="lightbox" id="lightbox" hidden>
  <button type="button" class="btn btn-icon lightbox-close" id="lightboxClose" aria-label="Close">✕</button>
  <img id="lightboxImg" alt="">
</div>

<script type="module" src="app.js?v=1hiryo6"></script>
</body>
</html>
