<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bench Runs</title>
<meta name="description" content="LLM benchmark runs: metrics, images, video and interactive WASM demos.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<script>
  // ── Site configuration ──────────────────────────────────────────────────────
  window.BENCH_CONFIG = {
    title: 'Bench Runs',
    subtitle: 'LLM evaluation results — metrics, media and interactive WASM demos.',
    manifest: 'data/results.json',   // generated by scripts/build-manifest.mjs
    repoUrl: 'https://github.com/fenderog/bench-runs',  // adds a GitHub button to the header
    pollSeconds: 30,                 // how often to check for new results (0 = off)
    showJson: true                   // per-run "raw JSON" button
  };
  // Apply the saved theme before paint to avoid a flash.
  try {
    var saved = localStorage.getItem('bench.theme');
    document.documentElement.dataset.theme = saved ||
      (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  } catch (e) {}
</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to results</a>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/" id="brandLink">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M4 19V9M9.3 19V5M14.7 19v-7M20 19V8"/>
        </svg>
      </span>
      <span class="brand-text">
        <strong id="siteTitle">Bench Runs</strong>
        <small id="siteSubtitle"></small>
      </span>
    </a>

    <div class="topbar-actions">
      <span class="live" id="live" title="Auto-refresh status">
        <span class="live-dot" aria-hidden="true"></span>
        <span class="live-text" id="liveText">connecting…</span>
      </span>
      <button type="button" class="btn btn-ghost" id="repoBtn" hidden>GitHub</button>
      <button type="button" class="btn btn-ghost" id="refreshBtn" title="Check for new results (R)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg>
        <span>Refresh</span>
      </button>
      <button type="button" class="btn btn-ghost btn-icon" id="themeBtn" title="Toggle theme (T)" aria-label="Toggle colour theme">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M21 13.2A8.6 8.6 0 1 1 10.8 3a6.6 6.6 0 0 0 10.2 10.2Z"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="main">
  <section class="controls" aria-label="Filter and sort">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input type="search" id="search" placeholder="Search runs, models, benchmarks, tags…" autocomplete="off" spellcheck="false" aria-label="Search runs">
      <kbd class="hint-key">/</kbd>
    </div>
    <div class="control-row">
      <div class="chips" id="filters"></div>
      <div class="control-right">
        <span class="result-count" id="count" aria-live="polite"></span>
        <label class="select">
          <span>Sort</span>
          <select id="sort">
            <option value="date-desc">Newest first</option>
            <option value="date-asc">Oldest first</option>
            <option value="title-asc">Title A–Z</option>
            <option value="model-asc">Model A–Z</option>
            <option value="accuracy-desc">Best accuracy</option>
          </select>
        </label>
      </div>
    </div>
  </section>

  <div class="notice" id="notice" hidden></div>

  <section id="grid" class="grid" aria-label="Benchmark runs"></section>

  <div class="empty" id="empty" hidden>
    <h2>Nothing to show</h2>
    <p id="emptyHint">Add a folder under <code>public/results/&lt;run-id&gt;/</code> with a <code>run.json</code>, then run <code>npm run manifest</code>.</p>
  </div>

  <footer class="footer">
    <span id="footerMeta"></span>
    <span class="footer-actions">
      <button type="button" class="btn btn-ghost" id="topBtn">Back to top</button>
    </span>
  </footer>
</main>

<dialog id="detail" class="detail">
  <article class="detail-inner">
    <div class="detail-bar">
      <button type="button" class="btn btn-ghost btn-icon" id="closeBtn" aria-label="Close (Esc)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div id="detailContent"></div>
  </article>
</dialog>

<div class="lightbox" id="lightbox" hidden>
  <button type="button" class="btn btn-ghost btn-icon lightbox-close" id="lightboxClose" aria-label="Close">✕</button>
  <img id="lightboxImg" alt="">
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
